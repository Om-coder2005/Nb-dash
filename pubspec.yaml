name: nextbills
description: NextBills - Professional Hotel POS System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Database
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.42

  # Storage & Files
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  file_picker: ^8.3.7
  share_plus: ^10.1.4

  # Excel
  excel: ^4.0.3

  # Utility
  intl: ^0.19.0
  uuid: ^4.4.2
  collection: ^1.18.0
  crypto: ^3.0.3

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  permission_handler: ^11.4.0

  # Printing & PDF
  flutter_bluetooth_serial: ^0.4.0
  esc_pos_utils_plus: ^2.0.4
  image: ^4.3.0
  qr: ^3.0.1
  pdf: ^3.10.8
  ffi: ^2.2.0

  # Video Playback
  video_player: ^2.9.2
  video_player_win: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true
  assets:
    - assets/intro.mp4
    - assets/inhanced_intro.mp4
    - assets/mobile_intro.mp4
    - assets/logo.png
    - assets/logo.jpeg
    - assets/sample_menu.xlsx