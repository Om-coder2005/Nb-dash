<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thermal Receipt Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 36px 16px 60px;
      font-family: 'Courier New', Courier, monospace;
      color: #e2e8f0;
    }

    h1 {
      font-family: sans-serif;
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 20px;
    }

    /* Width selector */
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      align-items: center;
    }
    .controls span {
      font-family: sans-serif;
      font-size: 0.75rem;
      color: #94a3b8;
      letter-spacing: 1px;
    }
    .width-btn {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid #334155;
      background: transparent;
      color: #94a3b8;
      font-size: 0.78rem;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      transition: all .18s;
    }
    .width-btn:hover { border-color: #fbbf24; color: #fbbf24; }
    .width-btn.active {
      background: #fbbf24;
      border-color: #fbbf24;
      color: #0f172a;
      font-weight: 700;
    }

    /* Receipt paper */
    .paper-wrap {
      position: relative;
      display: inline-block;
      filter: drop-shadow(0 16px 48px rgba(0,0,0,0.7));
    }
    .paper {
      background: #fffef9;
      padding: 12px 14px 10px;
      border-radius: 3px 3px 0 0;
      display: inline-block;
    }
    pre#receipt {
      margin: 0; padding: 0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12.5px;
      line-height: 1.5;
      color: #111;
      white-space: pre;
      tab-size: 1;
    }
    .tear {
      background: #fffef9;
      height: 14px;
      width: 100%;
      clip-path: polygon(
        0 0,3.3% 100%,6.6% 0,10% 100%,13.3% 0,16.7% 100%,20% 0,
        23.3% 100%,26.6% 0,30% 100%,33.3% 0,36.7% 100%,40% 0,
        43.3% 100%,46.6% 0,50% 100%,53.3% 0,56.7% 100%,60% 0,
        63.3% 100%,66.6% 0,70% 100%,73.3% 0,76.7% 100%,80% 0,
        83.3% 100%,86.7% 0,90% 100%,93.3% 0,96.7% 100%,100% 0
      );
    }

    /* Action buttons */
    .actions { margin-top: 22px; display: flex; gap: 10px; }
    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.4px;
      transition: transform .15s, box-shadow .15s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-print {
      background: linear-gradient(135deg,#fbbf24,#d97706);
      color: #0f172a;
      box-shadow: 0 4px 16px rgba(251,191,36,.3);
    }
    .btn-copy {
      background: rgba(255,255,255,0.06);
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .btn-copy:hover { color: #e2e8f0; border-color: #64748b; }

    /* Status badge */
    .badge {
      margin-top: 14px;
      font-family: sans-serif;
      font-size: 0.7rem;
      color: #4ade80;
      letter-spacing: 1px;
      opacity: 0;
      transition: opacity .3s;
    }
    .badge.show { opacity: 1; }

    @media print {
      body { background:#fff; padding:0; display:block; }
      h1,.controls,.actions,.badge { display:none; }
      .paper-wrap { filter:none; }
      .paper { padding:2px 4px; }
      .tear { display:none; }
      pre#receipt { font-size:10.5px; line-height:1.4; }
      @page { size:80mm auto; margin:3mm 2mm; }
    }
  </style>
</head>
<body>

<h1>⚡ Thermal Receipt Generator</h1>

<div class="controls">
  <span>Printer Width:</span>
  <button class="width-btn" data-w="32" onclick="setWidth(32)">32 ch</button>
  <button class="width-btn active" data-w="42" onclick="setWidth(42)">42 ch</button>
  <button class="width-btn" data-w="48" onclick="setWidth(48)">48 ch</button>
</div>

<div class="paper-wrap">
  <div class="paper">
    <pre id="receipt"></pre>
  </div>
  <div class="tear"></div>
</div>

<div class="actions">
  <button class="btn btn-print" onclick="window.print()">🖨️ Print</button>
  <button class="btn btn-copy" onclick="copyText()">📋 Copy Text</button>
</div>
<p class="badge" id="badge">✔ Copied to clipboard</p>

<script>
// ─── Data ───────────────────────────────────────────────────────────────────
const SHOP = {
  name    : 'SPICE GARDEN',
  addr1   : '123, MG Road, Koramangala',
  addr2   : 'Bengaluru - 560034',
  bill    : '#2047',
  date    : '17/04/26',
  time    : '05:27 PM',
  table   : 'T-04',
  cashier : 'Rajan K.',
};

const ITEMS = [
  { name:'Butter Chicken', qty:2, rate:280.00 },
  { name:'Garlic Naan',    qty:4,  rate:40.00 },
  { name:'Dal Makhani',    qty:1, rate:220.00 },
  { name:'Raita',          qty:1,  rate:60.00 },
  { name:'Mango Lassi',    qty:2,  rate:70.00 },
  { name:'Gulab Jamun',    qty:2,  rate:40.00 },
];

// ─── Helpers ────────────────────────────────────────────────────────────────

/** Truncate string to maxLen */
function trunc(str, maxLen) {
  if (str.length <= maxLen) return str;
  return str.slice(0, maxLen - 1) + '~';
}

/** Center a string within width */
function center(str, width) {
  str = trunc(str, width);
  const pad = Math.max(0, width - str.length);
  const left = Math.floor(pad / 2);
  const right = pad - left;
  return ' '.repeat(left) + str + ' '.repeat(right);
}

/** Left-pad (right-align) */
function rpad(str, width) {
  str = String(str);
  return str.length >= width ? str.slice(0, width) : ' '.repeat(width - str.length) + str;
}

/** Right-pad (left-align) */
function lpad(str, width) {
  str = String(str);
  return str.length >= width ? str.slice(0, width) : str + ' '.repeat(width - str.length);
}

/** Divider line */
function div(w) { return '-'.repeat(w); }

// ─── Layout Builders ────────────────────────────────────────────────────────

/**
 * 32-char layout: tight 3-col  Item(16) Qty(3) Price(9) + 2 gaps = 32
 * Header uses 32 chars
 */
function build32() {
  const W = 32;
  // col widths (must sum to W)
  const CW = { item:16, qty:3, price:9 }; // 16+1+3+1+9 = 30 + 2 spaces = 32? Let's just concat

  const lines = [];
  const D = div(W);

  lines.push(D);
  lines.push(center(SHOP.name,  W));
  lines.push(center(trunc(SHOP.addr1, W), W));
  lines.push(center(trunc(SHOP.addr2, W), W));
  lines.push(D);

  // Bill info — two short rows
  const billRow = lpad(`No:${SHOP.bill}`, 16) + rpad(SHOP.date, 10) + '  '.slice(0,W-26);
  lines.push(trunc(`No:${SHOP.bill}  ${SHOP.date}`, W));
  lines.push(trunc(`${SHOP.time}  Tbl:${SHOP.table}  ${SHOP.cashier}`, W));
  lines.push(D);

  // Header row: Item(16) Qty(4) Price(8) → 16+1+4+1+8 = 30 → pad to 32
  lines.push(lpad('Item',16) + ' ' + lpad('Qty',4) + rpad('Price',8).slice(0,8));
  lines.push(D);

  let total = 0;
  for (const it of ITEMS) {
    const amt = it.qty * it.rate;
    total += amt;
    const nameCol  = lpad(trunc(it.name, 14), 14);
    const qtyCol   = lpad(String(it.qty), 4);
    const priceCol = rpad(amt.toFixed(2), 12);
    const row = (nameCol + ' ' + qtyCol + ' ' + priceCol).slice(0, W);
    lines.push(row);
  }

  lines.push(D);
  lines.push((lpad('TOTAL', 18) + rpad(total.toFixed(2), W - 18)).slice(0, W));
  lines.push(D);
  lines.push(center('* Thank You! *', W));
  lines.push(center('Visit Again!',   W));
  lines.push(D);

  return lines.join('\n');
}

/**
 * 42-char layout: Item(20) Qty(4) Price(10) → + gaps = 42
 */
function build42() {
  const W = 42;
  const lines = [];
  const D = div(W);

  lines.push(D);
  lines.push(center(SHOP.name,  W));
  lines.push(center(trunc(SHOP.addr1,W), W));
  lines.push(center(trunc(SHOP.addr2,W), W));
  lines.push(D);

  // Bill meta: two columns
  const leftB  = `Bill : ${SHOP.bill}`;
  const rightB = `Date : ${SHOP.date}`;
  lines.push(lpad(leftB, 20) + ' ' + lpad(rightB, W - 21));
  const leftT  = `Time : ${SHOP.time}`;
  const rightT = `Table: ${SHOP.table}`;
  lines.push(lpad(leftT, 20) + ' ' + lpad(rightT, W - 21));
  lines.push(`Cashier: ${trunc(SHOP.cashier, W - 9)}`);
  lines.push(D);

  // Column header: Item(20) Qty(5) Price(11) — gaps fill 42
  // 20 + 1 + 5 + 1 + 10 = 37 … let's use: 20+1+4+1+10 = 36 + 6 right = done
  const H = lpad('Item',20) + ' ' + lpad('Qty',4) + ' ' + rpad('Price',11);
  lines.push(H.slice(0,W));
  lines.push(D);

  let total = 0;
  for (const it of ITEMS) {
    const amt = it.qty * it.rate;
    total += amt;
    const nameCol  = lpad(trunc(it.name, 20), 20);
    const qtyCol   = lpad(String(it.qty), 4);
    const priceCol = rpad(amt.toFixed(2), 12);
    const row = (nameCol + ' ' + qtyCol + ' ' + priceCol).slice(0, W);
    lines.push(row);
  }

  lines.push(D);
  lines.push((lpad('TOTAL', 24) + rpad(total.toFixed(2), W - 24)).slice(0, W));
  lines.push(D);
  lines.push(center('* Thank You! *', W));
  lines.push(center('Visit Again!',   W));
  lines.push(D);

  return lines.join('\n');
}

/**
 * 48-char layout: Full 4-col  Item(20) Qty(4) Rate(8) Amt(10) + 3 gaps = 48-1 ≈ 48
 */
function build48() {
  const W = 48;
  const lines = [];
  const D = div(W);

  lines.push(D);
  lines.push(center(SHOP.name,  W));
  lines.push(center(trunc(SHOP.addr1,W), W));
  lines.push(center(trunc(SHOP.addr2,W), W));
  lines.push(D);

  const leftB  = `Bill : ${SHOP.bill}`;
  const rightB = `Date : ${SHOP.date}`;
  lines.push(lpad(leftB, 24) + lpad(rightB, W - 24));
  const leftT  = `Time : ${SHOP.time}`;
  const rightT = `Table: ${SHOP.table}`;
  lines.push(lpad(leftT, 24) + lpad(rightT, W - 24));
  lines.push(`Cashier: ${trunc(SHOP.cashier, W - 9)}`);
  lines.push(D);

  // 4-col header: Item(20) Qty(4) Rate(8) Amt(10) — total = 20+1+4+1+8+1+10 = 45 + 3 = 48
  const H48 = lpad('Item',20) + ' ' + lpad('Qty',4) + ' ' + lpad('Rate',8) + ' ' + rpad('Amount',10);
  lines.push(H48.slice(0,W));
  lines.push(D);

  let total = 0;
  for (const it of ITEMS) {
    const amt = it.qty * it.rate;
    total += amt;
    const nameCol  = lpad(trunc(it.name, 20), 20);
    const qtyCol   = lpad(String(it.qty), 4);
    const rateCol  = rpad(it.rate.toFixed(2), 8);
    const amtCol   = rpad(amt.toFixed(2), 10);
    const row = (nameCol + ' ' + qtyCol + ' ' + rateCol + ' ' + amtCol).slice(0, W);
    lines.push(row);
  }

  lines.push(D);
  lines.push((lpad('TOTAL', 30) + rpad(total.toFixed(2), W - 30)).slice(0, W));
  lines.push(D);
  lines.push(center('* Thank You! *', W));
  lines.push(center('Visit Again!',   W));
  lines.push(D);

  return lines.join('\n');
}

// ─── Render ──────────────────────────────────────────────────────────────────

let currentWidth = 42;

function render() {
  let text;
  if (currentWidth === 32) text = build32();
  else if (currentWidth === 48) text = build48();
  else text = build42();
  document.getElementById('receipt').textContent = text;

  // Resize paper font to keep it within viewport nicely
  const charPx = { 32: 13.5, 42: 12.5, 48: 11.5 };
  document.getElementById('receipt').style.fontSize = charPx[currentWidth] + 'px';
}

function setWidth(w) {
  currentWidth = w;
  document.querySelectorAll('.width-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.w) === w);
  });
  render();
}

function copyText() {
  const text = document.getElementById('receipt').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const b = document.getElementById('badge');
    b.classList.add('show');
    setTimeout(() => b.classList.remove('show'), 2000);
  });
}

// Init
render();
</script>
</body>
</html>
